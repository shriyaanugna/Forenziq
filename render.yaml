services:
  - type: web
    name: forenziq-backend
    env: node
    buildCommand: npm run build --workspace=backend
    startCommand: npm run start --workspace=backend
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 3001
      - key: NODE_ENV
        value: production

  - type: web
    name: forenziq-frontend
    env: static
    buildCommand: npm run build --workspace=frontend
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://forenziq-backend.onrender.com
